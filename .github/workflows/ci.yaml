name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [ready_for_review]
    branches: ["main"]

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22.16.0]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install Pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Start database container
        run: docker compose --env-file .env up -d 05-nest-clean-postgresql

      - name: Wait for user role to exist
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          echo "Aguardando role 'docker' ser criada..."
          for i in {1..30}; do
            RESULT=$(PGPASSWORD=docker \
              psql -h localhost -U docker -tAc "SELECT 1 FROM pg_roles WHERE rolname='docker'")
            if [ "$RESULT" = "1" ]; then
              echo "✅ Role 'docker' encontrada!"
              break
            fi
            echo "Tentativa $i: Role ainda não criada... aguardando 2s"
            sleep 2
          done

      - name: Test DB connection
        run: |
          echo "Testando conexão com o banco de dados..."
          PGPASSWORD=docker \
            psql -h localhost -U docker -d 05nestclean \
            -c "SELECT datname FROM pg_database;"

      - name: Run Prisma Generate
        run: pnpm prisma generate

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          DATABASE_USERNAME: docker
          DATABASE_PASSWORD: docker
          DATABASE_NAME: 05nestclean
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

      - name: Generate Tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/05-nest-clean:${{ steps.generate_tag.outputs.sha }}, ${{ vars.DOCKERHUB_USERNAME }}/05-nest-clean:latest
