name: CI

on:
  push:
    branches: ["main", "chore/pipeline"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: "Build and push"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: bitnami/postgresql
        ports:
          - 5432:5432
        env:
          POSTGRESQL_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          POSTGRESQL_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRESQL_DATABASE: ${{ secrets.DATABASE_NAME }}
    strategy:
      matrix:
        node: [20, 22, 22.16.0]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install Pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ secrets.DATABASE_USERNAME }}; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
        env:
          PGPASSWORD: ${{ secrets.DATABASE_PASSWORD }}

      - name: Install dependencies
        run: pnpm install

      - name: Build docker image
        run: docker build -t 05-nest-clean-api:0.0.1 .
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
