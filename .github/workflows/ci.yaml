name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22.16.0"
  PNPM_VERSION: "10"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run Biome check
        run: pnpm run check

      - name: Run Biome lint
        run: pnpm run lint

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run unit tests
        run: pnpm test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    services:
      postgres:
        image: bitnami/postgresql:17.2.0
        env:
          POSTGRESQL_USERNAME:  ${{ secrets.DATABASE_USERNAME }}
          POSTGRESQL_PASSWORD:  ${{ secrets.DATABASE_PASSWORD }}
          POSTGRESQL_DATABASE:  ${{ secrets.DATABASE_NAME }}
        options: >-
          --health-cmd="pg_isready -U postgres -d nest_clean_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 5432:5432

    env:
      NODE_ENV: "test"
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run database migrations
        run: pnpm prisma migrate deploy

      - name: Run E2E tests
        run: pnpm run test:e2e

  release: 
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, test-unit, test-e2e]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps: 
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"


      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}


  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, test-unit, test-e2e, release]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read

    outputs:
      image-tag: ${{ steps.generate_tag.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build application
        run: pnpm run build

      - name: Generate image tag
        id: generate_tag
        run: |
          SHA=$(echo $GITHUB_SHA | head -c7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        if: false
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ID }}
          aws-region: us-east-2

      - name: Login to AWS ECR
        id: login_ecr
        if: false
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build_docker_image
        if: false
        env: 
          REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          TAG: ${{ steps.generate_tag.outputs.sha }}
        run: |
          docker build -t $REGISTRY/nest-clean-api:$TAG -t $REGISTRY/nest-clean-api:latest .
          docker push $REGISTRY/nest-clean-api --all-tags
          IMAGE_URI=$REGISTRY/nest-clean-api:$TAG
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        id: deploy-app-runner 
        if: false
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service: nest-clean-api
          image: ${{ steps.build_docker_image.outputs.image }}
          access-role-arn: ${{ secrets.APP_RUNNER_ROLE_ID }}
          region: us-east-2
          cpu: 1
          memory: 2
          port: 3333
          wait-for-service-stability-seconds: 180

      - name: App Runner check
        if: false
        run: echo "App Runner running... ${{ steps.deploy-app-runner.outputs.service-url }}"
