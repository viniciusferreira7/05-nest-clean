name: CI

on:
  push:
    branches: ["main", "chore/pipeline"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: "Build and push"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [20, 22, 22.16.0]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install Pnpm
        with:
          version: 10
          run_install: false

      - name: Install Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install

      - name: Build docker image
        run: pnpm start:containers
