services:
  05-nest-clean-postgresql:
    container_name: 05-nest-clean-postgresql
    image: postgres:17.2
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - 05-nest-clean-network
    volumes:
      - 05_nest_clean_data:/var/lib/postgresql/data

  05-nest-clean-redis:
    container_name: 05-nest-clean-redis
    image: redis:7-alpine
    ports:
      - 6379:6379
    command: redis-server --appendonly yes
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - 05-nest-clean-network
    volumes:
      - 05_nest_clean_redis_data:/data

  server:
    build:
      context: .
    image: ${DOCKERHUB_USERNAME}/05-nest-clean:${IMAGE_TAG}
    container_name: 05-nest-clean
    environment:
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - 3333:3333
    depends_on:
      05-nest-clean-postgresql:
        condition: service_healthy
      05-nest-clean-redis:
        condition: service_healthy
    networks:
      - 05-nest-clean-network

networks:
  05-nest-clean-network:
    driver: bridge

volumes:
  05_nest_clean_data:
  05_nest_clean_redis_data:
